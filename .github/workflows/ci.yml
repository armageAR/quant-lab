name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quant_lab_test
          POSTGRES_USER: quant_lab_test
          POSTGRES_PASSWORD: quant_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_lab_test -d quant_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://quant_lab_test:quant_lab_test@localhost:5432/quant_lab_test
      NODE_ENV: test
      LOG_FORMAT: json
      LIVE_EXECUTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check:ci
